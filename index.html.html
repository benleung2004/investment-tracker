<!DOCTYPE html>
<html lang="zh-HK" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="月供追蹤">
<title>月供追蹤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --text-xs:clamp(0.75rem,0.7rem + 0.25vw,0.875rem);
  --text-sm:clamp(0.875rem,0.8rem + 0.35vw,1rem);
  --text-base:clamp(1rem,0.95rem + 0.25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem + 0.75vw,1.5rem);
  --s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s5:1.25rem;--s6:1.5rem;--s8:2rem;
  --r-sm:.375rem;--r-md:.5rem;--r-lg:.75rem;--r-xl:1rem;--r-full:9999px;
  --tr:180ms cubic-bezier(0.16,1,0.3,1);
  --fn:'Inter',-apple-system,sans-serif;
  --fm:'JetBrains Mono',monospace;
}
:root,[data-theme="dark"]{
  --bg:#0f1117;--sf:#161b27;--sf2:#1e2535;--sfo:#242c3d;
  --div:#2a3347;--bor:#303d55;
  --tx:#e2e8f0;--mu:#8892a4;--fa:#4a5568;
  --pr:#3b82f6;--prh:#2563eb;--prhl:#1e3a5f;
  --gr:#22c55e;--grb:#0d2918;
  --re:#ef4444;--reb:#2d0f0f;
  --go:#f59e0b;--gob:#2d1f07;
  --sh:0 1px 3px rgba(0,0,0,.4);
}
[data-theme="light"]{
  --bg:#f0f4f8;--sf:#fff;--sf2:#f7f9fc;--sfo:#eef2f7;
  --div:#e2e8f0;--bor:#cbd5e1;
  --tx:#1a202c;--mu:#4a5568;--fa:#a0aec0;
  --pr:#2563eb;--prh:#1d4ed8;--prhl:#dbeafe;
  --gr:#16a34a;--grb:#dcfce7;
  --re:#dc2626;--reb:#fee2e2;
  --go:#d97706;--gob:#fef3c7;
  --sh:0 1px 3px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:none;-webkit-font-smoothing:antialiased;}
body{min-height:100dvh;font-family:var(--fn);font-size:var(--text-sm);
  color:var(--tx);background:var(--bg);padding-bottom:env(safe-area-inset-bottom);}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit;}
input{font:inherit;color:inherit;background:none;}
a,button{transition:all var(--tr);}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;}

.topbar{position:sticky;top:0;z-index:100;background:var(--bg);
  border-bottom:1px solid var(--div);padding:var(--s3) var(--s4);
  display:flex;align-items:center;gap:var(--s3);
  padding-top:calc(var(--s3) + env(safe-area-inset-top));}
.tlogo{display:flex;align-items:center;gap:var(--s2);flex:1;}
.tlogo svg{color:var(--pr);}
.ttitle{font-size:var(--text-sm);font-weight:700;letter-spacing:-.01em;}
.tactions{display:flex;align-items:center;gap:var(--s2);}
.ibtn{width:36px;height:36px;border-radius:var(--r-md);display:flex;align-items:center;
  justify-content:center;color:var(--mu);border:1px solid var(--bor);background:var(--sf);}
.ibtn:hover{color:var(--tx);background:var(--sf2);}
.ibtn:active{transform:scale(.94);}

.main{flex:1;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4);}

.pxcard{background:linear-gradient(135deg,#1e2535,#1a2040);
  border:1px solid #2a3870;border-radius:var(--r-lg);padding:var(--s3) var(--s4);
  display:flex;align-items:center;gap:var(--s3);text-decoration:none;color:var(--tx);}
.pxcard:hover{border-color:var(--pr);}
.pxcard:active{transform:scale(.98);}
.pxicon{width:34px;height:34px;border-radius:var(--r-md);background:var(--pr);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
.pxtxt{flex:1;min-width:0;}
.pxtxt strong{display:block;font-size:var(--text-xs);font-weight:700;}
.pxtxt span{font-size:var(--text-xs);color:var(--mu);}

.reminder{background:var(--gob);border:1px solid var(--go);border-radius:var(--r-md);
  padding:var(--s3) var(--s4);display:flex;align-items:center;gap:var(--s3);
  font-size:var(--text-xs);color:var(--go);}

.cta-row{display:grid;grid-template-columns:1fr auto;gap:var(--s3);}
.btn-primary{padding:var(--s4);background:var(--pr);color:#fff;font-weight:700;
  font-size:var(--text-base);border-radius:var(--r-lg);display:flex;align-items:center;
  justify-content:center;gap:var(--s2);box-shadow:0 0 18px rgba(59,130,246,.3);}
.btn-primary:hover{background:var(--prh);}
.btn-primary:active{transform:scale(.98);}
.month-badge{background:var(--sf);border:1px solid var(--bor);border-radius:var(--r-lg);
  padding:var(--s3) var(--s4);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;min-width:80px;}
.mb-label{font-size:var(--text-xs);color:var(--mu);}
.mb-val{font-size:var(--text-sm);font-weight:700;font-family:var(--fm);color:var(--tx);}

.panel{background:var(--sf);border:1px solid var(--bor);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--sh);}
.ph{padding:var(--s3) var(--s4);border-bottom:1px solid var(--div);
  display:flex;align-items:center;justify-content:space-between;}
.pht{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);}
.phm{font-size:var(--text-xs);color:var(--fa);font-family:var(--fm);}

.fxrow{padding:var(--s3) var(--s4);display:flex;align-items:center;justify-content:space-between;}
.fxlbl{font-size:var(--text-xs);color:var(--mu);}
.fxval{font-size:var(--text-sm);font-weight:700;font-family:var(--fm);color:var(--go);}
.strow{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);
  border-top:1px solid var(--div);}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--gr);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.stxt{font-size:var(--text-xs);color:var(--fa);}
.stime{font-size:var(--text-xs);color:var(--fa);font-family:var(--fm);margin-left:auto;}

.arow{padding:var(--s3) var(--s4);border-bottom:1px solid var(--div);
  display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:var(--s3);}
.arow:last-child{border-bottom:none;}
.stk{font-size:var(--text-sm);font-weight:700;font-family:var(--fm);}
.snm{font-size:var(--text-xs);color:var(--mu);}
.sprrow{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:2px;}
.spr{font-size:var(--text-xs);color:var(--fa);font-family:var(--fm);}
.schg{font-size:var(--text-xs);font-family:var(--fm);font-weight:600;
  padding:1px 6px;border-radius:var(--r-full);}
.schg.up{color:var(--gr);background:var(--grb);}
.schg.dn{color:var(--re);background:var(--reb);}
.schg.fl{color:var(--mu);background:var(--sfo);}
.ausd{font-size:var(--text-sm);font-weight:600;font-family:var(--fm);}
.ahkd{font-size:var(--text-xs);font-family:var(--fm);color:var(--mu);}
.ash{font-size:var(--text-xs);color:var(--fa);font-family:var(--fm);}
.abadge{font-size:var(--text-xs);font-weight:700;font-family:var(--fm);
  padding:2px 8px;border-radius:var(--r-full);background:var(--prhl);
  color:var(--pr);min-width:40px;text-align:center;}

.pnl-box{background:var(--sf);border:1px solid var(--bor);border-radius:var(--r-lg);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2);}
.pnl-title{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--mu);}
.pnl-main{display:flex;align-items:baseline;justify-content:space-between;}
.pnl-usd{font-size:var(--text-lg);font-weight:700;font-family:var(--fm);}
.pnl-pct{font-size:var(--text-sm);font-weight:700;font-family:var(--fm);
  padding:3px 10px;border-radius:var(--r-full);}
.pnl-pct.up{background:var(--grb);color:var(--gr);}
.pnl-pct.dn{background:var(--reb);color:var(--re);}
.pnl-pct.fl{background:var(--sfo);color:var(--mu);}
.pnl-hkd{font-size:var(--text-xs);color:var(--mu);font-family:var(--fm);}

.prow{padding:var(--s3) var(--s4);border-bottom:1px solid var(--div);
  display:flex;flex-direction:column;gap:var(--s1);}
.prow:last-child{border-bottom:none;}
.prtop{display:flex;align-items:center;justify-content:space-between;}
.prsub{display:flex;align-items:center;justify-content:space-between;}
.gain{color:var(--gr);}.loss{color:var(--re);}.neut{color:var(--mu);}
.gbadge{font-size:var(--text-xs);font-weight:700;font-family:var(--fm);
  padding:2px 8px;border-radius:var(--r-full);}
.gbadge.up{background:var(--grb);color:var(--gr);}
.gbadge.dn{background:var(--reb);color:var(--re);}
.gbadge.fl{background:var(--sfo);color:var(--mu);}

.btn-ib{width:100%;padding:var(--s3) var(--s4);background:var(--sf);
  border:1px solid var(--bor);border-radius:var(--r-lg);
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  font-size:var(--text-sm);font-weight:600;}
.btn-ib:hover{background:var(--sf2);border-color:var(--pr);color:var(--pr);}
.btn-ib:active{transform:scale(.98);}
.ibdot{width:8px;height:8px;border-radius:50%;background:#e8372a;flex-shrink:0;}

.slbl{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--fa);}

.modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);
  backdrop-filter:blur(4px);align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--sf);border:1px solid var(--bor);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:var(--s6) var(--s4);
  padding-bottom:calc(var(--s6) + env(safe-area-inset-bottom));
  width:100%;max-width:480px;display:flex;flex-direction:column;gap:var(--s4);
  animation:slideUp .25s cubic-bezier(0.16,1,0.3,1);max-height:92dvh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--bor);border-radius:var(--r-full);margin:0 auto;}
.modal-title{font-size:var(--text-lg);font-weight:700;text-align:center;}
.ig{display:flex;flex-direction:column;gap:var(--s2);}
.ilbl{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);}
.ifield{padding:var(--s3) var(--s4);background:var(--sf2);
  border:1px solid var(--bor);border-radius:var(--r-md);
  font-size:var(--text-sm);font-family:var(--fm);font-weight:600;width:100%;color:var(--tx);}
.ifield:focus{outline:none;border-color:var(--pr);}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);}
.btn-save{padding:var(--s4);background:var(--pr);color:#fff;
  font-weight:700;border-radius:var(--r-lg);width:100%;font-size:var(--text-base);}
.btn-save:hover{background:var(--prh);}
.btn-save:active{transform:scale(.98);}
.btn-cancel{padding:var(--s3);color:var(--mu);font-size:var(--text-sm);width:100%;text-align:center;}

.cloud-box{background:var(--sf2);border:1px solid var(--bor);border-radius:var(--r-lg);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);}
.cloud-row{display:grid;grid-template-columns:1fr auto;gap:var(--s2);align-items:center;}
.cloud-btn{padding:var(--s2) var(--s4);border-radius:var(--r-md);font-size:var(--text-xs);
  font-weight:700;background:var(--prhl);color:var(--pr);border:1px solid var(--bor);}
.cloud-btn:hover{background:var(--pr);color:#fff;}
.cloud-status{font-size:var(--text-xs);color:var(--fa);font-family:var(--fm);}
.cloud-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);}

.toast{position:fixed;bottom:calc(var(--s6) + env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--sf2);border:1px solid var(--bor);border-radius:var(--r-lg);
  padding:var(--s3) var(--s5);font-size:var(--text-xs);font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:300;
  opacity:0;transition:all .3s cubic-bezier(0.16,1,0.3,1);pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{border-color:var(--gr);color:var(--gr);}
.toast.err{border-color:var(--re);color:var(--re);}
.toast.info{border-color:var(--pr);color:var(--pr);}

@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin .8s linear infinite;}
</style>
</head>
<body>
<div class="app">

<div class="topbar">
  <div class="tlogo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
    </svg>
    <span class="ttitle">月供追蹤</span>
  </div>
  <div class="tactions">
    <button class="ibtn" onclick="refreshAll()" aria-label="刷新">
      <svg id="refreshIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
    </button>
    <button class="ibtn" onclick="toggleTheme()" aria-label="主題">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <button class="ibtn" onclick="openSettings()" aria-label="設定">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>
</div>

<div class="main">

  <a class="pxcard" href="https://www.perplexity.ai/search/1d9c32ef-78a9-4b2c-bcf7-3b269301bdcb" onclick="openPerplexity(event)" target="_blank" rel="noopener noreferrer">
    <div class="pxicon">🤖</div>
    <div class="pxtxt">
      <strong>查閱月供 AI 投資建議</strong>
      <span>NVDA · QQQM · VOO · QLD 策略討論</span>
    </div>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fa);flex-shrink:0">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
    </svg>
  </a>

  <div class="reminder" id="reminder" style="display:none">
    🔔 &nbsp;今日係每月7號 — 月供日！記得入 IBKR 落單！
  </div>

  <div class="cta-row">
    <button class="btn-primary" onclick="calculateAllocation()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      月供
    </button>
    <div class="month-badge">
      <span class="mb-label">每月</span>
      <span class="mb-val" id="monthlyLabel">HKD 5,000</span>
    </div>
  </div>

  <div class="panel">
    <div class="fxrow">
      <span class="fxlbl">💱 USD / HKD 匯率</span>
      <span class="fxval" id="fxRate">載入中...</span>
    </div>
    <div class="strow">
      <div class="sdot" id="sdot"></div>
      <span class="stxt" id="stxt">正在獲取數據...</span>
      <span class="stime" id="stime"></span>
    </div>
  </div>

  <div id="allocSec" style="display:none;flex-direction:column;gap:var(--s4)">
    <div class="slbl">📊 本月月供分配</div>
    <div class="panel" id="allocPanel"></div>
    <button class="btn-ib" onclick="openIBKR()">
      <div class="ibdot"></div>
      開啟 IBKR 落單
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
    </button>
    <div class="pnl-box" id="pnlBox" style="display:none">
      <div class="pnl-title">📈 總盈虧</div>
      <div class="pnl-main">
        <span class="pnl-usd" id="pnlUsd">—</span>
        <span class="pnl-pct" id="pnlPct">—</span>
      </div>
      <div class="pnl-hkd" id="pnlHkd"></div>
    </div>
  </div>

  <div id="portSec" style="display:none">
    <div class="slbl" style="margin-bottom:var(--s3)">💼 我的持倉</div>
    <div class="panel" id="portPanel"></div>
  </div>

</div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsModal" onclick="closeOnOverlay(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">⚙️ 設定</div>

    <div class="ig">
      <label class="ilbl">每月供款 (HKD)</label>
      <input class="ifield" type="number" id="monthlyInput" placeholder="5000" inputmode="numeric">
    </div>

    <div style="display:flex;flex-direction:column;gap:var(--s2)">
      <div class="slbl">持倉記錄（計算盈虧）</div>
      <div class="pgrid" id="portInputs"></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:var(--s2)">
      <div class="slbl">☁️ 雲端備份 (JSONBin.io)</div>
      <div class="cloud-box">
        <div class="ig">
          <label class="ilbl">API Key</label>
          <input class="ifield" type="password" id="apiKeyInput" placeholder="$2a$10$...">
          <button style="font-size:var(--text-xs);color:var(--mu);text-align:left;padding:0" onclick="toggleApiVis()">👁 顯示/隱藏</button>
        </div>
        <div class="ig">
          <label class="ilbl">Bin ID <span style="font-weight:400;color:var(--fa);text-transform:none">(首次留空，自動建立)</span></label>
          <input class="ifield" type="text" id="binIdInput" placeholder="64abc...">
        </div>
        <div class="cloud-row">
          <span class="cloud-status" id="cloudStatus">未連接</span>
          <button class="cloud-btn" onclick="testCloud()">測試</button>
        </div>
        <div class="cloud-grid">
          <button class="cloud-btn" onclick="uploadCloud()">☁️ 上傳備份</button>
          <button class="cloud-btn" onclick="downloadCloud()">⬇️ 下載還原</button>
        </div>
      </div>
    </div>

    <button class="btn-save" onclick="saveSettings()">儲存</button>
    <button class="btn-cancel" onclick="closeSettings()">取消</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONSTANTS ──
const PERPLEXITY_URL = 'https://www.perplexity.ai/search/1d9c32ef-78a9-4b2c-bcf7-3b269301bdcb';
const DEFAULT_API_KEY = '$2a$10$I5ojo2wfoRU2QkNjw7gSv.SnyMJRxP87d7vouHKX.O0AFpQEjwE/K';
const FX_FALLBACK = 7.84;

const ALLOCS = [
  {ticker:'NVDA', name:'Nvidia Corp',        pct:.30, color:'#76b900'},
  {ticker:'QQQM', name:'Invesco Nasdaq 100', pct:.40, color:'#3b82f6'},
  {ticker:'VOO',  name:'Vanguard S&P 500',   pct:.20, color:'#8b5cf6'},
  {ticker:'QLD',  name:'ProShares 2x QQQ',  pct:.10, color:'#f59e0b'},
];

const FALLBACK_DATA = {
  NVDA: {price:198.34, change:-0.14, changePct:-0.07},
  QQQM: {price:477.54, change:+2.64, changePct:+0.56},
  VOO:  {price:541.20, change:+1.94, changePct:+0.36},
  QLD:  {price:105.44, change:-0.33, changePct:-0.31},
};

// ── STATE ──
let S = {
  monthly:   5000,
  fxRate:    FX_FALLBACK,
  data:      JSON.parse(JSON.stringify(FALLBACK_DATA)),
  portfolio: {NVDA:0, QQQM:0, VOO:0, QLD:0},
  costBasis: {NVDA:0, QQQM:0, VOO:0, QLD:0},
  apiKey:    DEFAULT_API_KEY,
  binId:     '',
  lastRefresh: null,
};

// ── TOAST ──
function toast(msg, type='ok', dur=3000){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`toast show ${type}`;
  clearTimeout(t._t);
  t._t=setTimeout(()=>{ t.className='toast'; }, dur);
}

// ── THEME ──
function toggleTheme(){
  const h=document.documentElement;
  const n=h.getAttribute('data-theme')==='dark'?'light':'dark';
  h.setAttribute('data-theme',n);
  document.getElementById('themeIcon').innerHTML = n==='dark'
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    : '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
}

// ── API KEY TOGGLE ──
function toggleApiVis(){
  const f=document.getElementById('apiKeyInput');
  f.type=f.type==='password'?'text':'password';
}

// ── PERPLEXITY ──
function openPerplexity(e){
  e.preventDefault();
  if(/iPad|iPhone|iPod/.test(navigator.userAgent)){
    const fr=document.createElement('iframe');
    fr.style.display='none'; fr.src='perplexity://';
    document.body.appendChild(fr);
    setTimeout(()=>{ document.body.removeChild(fr); window.open(PERPLEXITY_URL,'_blank'); },1200);
  } else { window.open(PERPLEXITY_URL,'_blank'); }
}

// ── IBKR ──
function openIBKR(){
  if(/iPad|iPhone|iPod/.test(navigator.userAgent)){
    const fr=document.createElement('iframe');
    fr.style.display='none'; fr.src='ibkr://';
    document.body.appendChild(fr);
    setTimeout(()=>{ document.body.removeChild(fr); window.open('https://www.interactivebrokers.com.hk','_blank'); },1200);
  } else { window.open('https://www.interactivebrokers.com.hk','_blank'); }
}

// ── FETCH ──
async function fetchYahoo(sym){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=1d`;
  const proxy=`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
  const r=await fetch(proxy,{signal:AbortSignal.timeout(9000)});
  const d=await r.json();
  const meta=JSON.parse(d.contents)?.chart?.result?.[0]?.meta;
  if(!meta) return null;
  const price=meta.regularMarketPrice;
  const prev=meta.chartPreviousClose||meta.previousClose||price;
  return {price, change:+(price-prev).toFixed(2), changePct:+((price-prev)/prev*100).toFixed(2)};
}

async function refreshAll(){
  const icon=document.getElementById('refreshIcon');
  icon.classList.add('spinning');
  setStatus('正在獲取實時數據...', false);
  const syms=['NVDA','QQQM','VOO','QLD','HKD=X'];
  const res=await Promise.allSettled(syms.map(s=>fetchYahoo(s)));
  syms.forEach((sym,i)=>{
    if(res[i].status==='fulfilled'&&res[i].value){
      const v=res[i].value;
      if(sym==='HKD=X'){
        const r=+(1/v.price).toFixed(4);
        if(r>=7.75&&r<=7.90) S.fxRate=r;
      } else { S.data[sym]=v; }
    }
  });
  document.getElementById('fxRate').textContent=`1 USD = HKD ${S.fxRate.toFixed(4)}`;
  const now=new Date();
  S.lastRefresh=now.toLocaleString('zh-HK',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  setStatus('上次更新', true);
  document.getElementById('stime').textContent=S.lastRefresh;
  icon.classList.remove('spinning');
  calculateAllocation();
  renderPortfolio();
  renderPNL();
}

function setStatus(msg,ok){
  document.getElementById('stxt').textContent=msg;
  document.getElementById('sdot').style.background=ok?'var(--gr)':'var(--go)';
}

// ── CHANGE BADGE ──
function chgBadge(change,pct){
  if(change==null) return '';
  const s=change>=0?'+':'', cl=change>0?'up':change<0?'dn':'fl';
  return `<span class="schg ${cl}">${s}${change.toFixed(2)} (${s}${pct.toFixed(2)}%)</span>`;
}

// ── ALLOCATION ──
function calculateAllocation(){
  const usdTotal=S.monthly/S.fxRate;
  let html=`<div class="ph">
    <span class="pht">月供分配</span>
    <span class="phm">HKD ${S.monthly.toLocaleString()} ≈ USD ${usdTotal.toFixed(0)}</span>
  </div>`;
  for(const a of ALLOCS){
    const hkdAmt=S.monthly*a.pct, usdAmt=hkdAmt/S.fxRate;
    const d=S.data[a.ticker], pr=d?.price;
    const sh=pr?(usdAmt/pr).toFixed(4):'...', ps=pr?`$${pr.toFixed(2)}`:'—';
    const cb=d?chgBadge(d.change,d.changePct):'';
    html+=`<div class="arow">
      <div>
        <div class="stk" style="color:${a.color}">${a.ticker}</div>
        <div class="snm">${a.name}</div>
        <div class="sprrow"><span class="spr">${ps}</span>${cb}</div>
      </div>
      <div style="text-align:right">
        <div class="ausd">$${usdAmt.toFixed(0)}</div>
        <div class="ahkd">HKD ${hkdAmt.toFixed(0)}</div>
        <div class="ash">${sh} 股</div>
      </div>
      <div class="abadge">${(a.pct*100).toFixed(0)}%</div>
    </div>`;
  }
  document.getElementById('allocPanel').innerHTML=html;
  document.getElementById('allocSec').style.display='flex';
  document.getElementById('monthlyLabel').textContent=`HKD ${S.monthly.toLocaleString()}`;
  renderPNL();
}

// ── PNL ──
function renderPNL(){
  const hasPf=Object.values(S.portfolio).some(v=>v>0);
  const box=document.getElementById('pnlBox');
  if(!hasPf){ box.style.display='none'; return; }
  let totalCost=0, totalVal=0;
  for(const a of ALLOCS){
    const sh=S.portfolio[a.ticker]||0; if(!sh) continue;
    const cost=S.costBasis[a.ticker]||0;
    const pr=(S.data[a.ticker]?.price)||cost;
    totalCost+=cost*sh; totalVal+=pr*sh;
  }
  const g=totalVal-totalCost, gp=totalCost>0?g/totalCost*100:0;
  const sign=g>=0?'+':'', cls=g>0?'up':g<0?'dn':'fl';
  document.getElementById('pnlUsd').textContent=`${sign}USD ${g.toFixed(2)}`;
  document.getElementById('pnlUsd').className=`pnl-usd ${g>0?'gain':g<0?'loss':'neut'}`;
  document.getElementById('pnlPct').textContent=`${sign}${gp.toFixed(2)}%`;
  document.getElementById('pnlPct').className=`pnl-pct ${cls}`;
  document.getElementById('pnlHkd').textContent=`≈ ${sign}HKD ${(g*S.fxRate).toFixed(0)}`;
  box.style.display='block';
}

// ── PORTFOLIO ──
function renderPortfolio(){
  const sec=document.getElementById('portSec');
  if(!Object.values(S.portfolio).some(v=>v>0)){ sec.style.display='none'; return; }
  let html='<div class="ph"><span class="pht">持倉概覽</span></div>';
  for(const a of ALLOCS){
    const sh=S.portfolio[a.ticker]||0; if(!sh) continue;
    const cost=S.costBasis[a.ticker]||0;
    const pr=(S.data[a.ticker]?.price)||cost;
    const val=pr*sh, g=val-cost*sh, gp=cost>0?(pr-cost)/cost*100:0;
    const cl=g>0?'up':g<0?'dn':'fl', ar=g>0?'▲':g<0?'▼':'—';
    const gc=g>0?'gain':g<0?'loss':'neut';
    html+=`<div class="prow">
      <div class="prtop">
        <div>
          <span style="font-weight:700;font-family:var(--fm);color:${a.color}">${a.ticker}</span>
          <span style="font-size:var(--text-xs);color:var(--mu);margin-left:.5rem">${sh}股 @ $${cost.toFixed(2)}</span>
        </div>
        <span class="gbadge ${cl}">${ar} ${Math.abs(gp).toFixed(2)}%</span>
      </div>
      <div class="prsub">
        <span style="font-size:var(--text-xs);color:var(--mu)">市值 HKD ${(val*S.fxRate).toFixed(0)}</span>
        <span class="${gc}" style="font-size:var(--text-xs);font-family:var(--fm)">
          ${g>=0?'+':''}USD ${g.toFixed(2)} / HKD ${(g*S.fxRate).toFixed(0)}
        </span>
      </div>
    </div>`;
  }
  document.getElementById('portPanel').innerHTML=html;
  sec.style.display='block';
}

// ── SETTINGS ──
function openSettings(){
  document.getElementById('monthlyInput').value=S.monthly;
  document.getElementById('apiKeyInput').value=S.apiKey;
  document.getElementById('binIdInput').value=S.binId;
  let h='';
  for(const a of ALLOCS){
    h+=`<div class="ig">
      <label class="ilbl" style="color:${a.color}">${a.ticker} 持股</label>
      <input class="ifield" type="number" id="p_${a.ticker}" value="${S.portfolio[a.ticker]||''}" placeholder="0" step="0.0001" inputmode="decimal">
    </div>
    <div class="ig">
      <label class="ilbl">${a.ticker} 成本($)</label>
      <input class="ifield" type="number" id="c_${a.ticker}" value="${S.costBasis[a.ticker]||''}" placeholder="0.00" step="0.01" inputmode="decimal">
    </div>`;
  }
  document.getElementById('portInputs').innerHTML=h;
  updateCloudStatus();
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings(){ document.getElementById('settingsModal').classList.remove('open'); }
function closeOnOverlay(e){ if(e.target===e.currentTarget) closeSettings(); }

function saveSettings(){
  const v=parseFloat(document.getElementById('monthlyInput').value);
  if(!isNaN(v)&&v>0) S.monthly=v;
  for(const a of ALLOCS){
    const sh=parseFloat(document.getElementById(`p_${a.ticker}`)?.value);
    const co=parseFloat(document.getElementById(`c_${a.ticker}`)?.value);
    if(!isNaN(sh)) S.portfolio[a.ticker]=sh;
    if(!isNaN(co)) S.costBasis[a.ticker]=co;
  }
  const ak=document.getElementById('apiKeyInput').value.trim();
  const bi=document.getElementById('binIdInput').value.trim();
  if(ak) S.apiKey=ak;
  if(bi) S.binId=bi;
  closeSettings();
  calculateAllocation();
  renderPortfolio();
  renderPNL();
  toast('設定已儲存 ✓');
}

// ── CLOUD ──
function updateCloudStatus(){
  const s=document.getElementById('cloudStatus');
  if(!S.apiKey){ s.textContent='未設定 API Key'; return; }
  s.textContent=S.binId?`Bin: ${S.binId.slice(0,14)}...`:'API Key 已設定，尚未建立 Bin';
}

async function testCloud(){
  const key=document.getElementById('apiKeyInput').value.trim()||S.apiKey;
  if(!key){ toast('請先輸入 API Key','err'); return; }
  toast('測試中...','info');
  try{
    const r=await fetch('https://api.jsonbin.io/v3/b',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Master-Key':key,'X-Bin-Name':'ping-test'},
      body:JSON.stringify({ping:true}),
      signal:AbortSignal.timeout(8000)
    });
    const d=await r.json();
    if(d?.record){ toast('連接成功！API Key 有效 ✓'); document.getElementById('cloudStatus').textContent='API Key 有效 ✓'; }
    else { toast('連接失敗：'+(d?.message||'未知'),'err'); }
  } catch(e){ toast('連接失敗：'+e.message,'err'); }
}

function buildPayload(){
  // read from inputs if open
  const v=parseFloat(document.getElementById('monthlyInput')?.value);
  if(!isNaN(v)&&v>0) S.monthly=v;
  for(const a of ALLOCS){
    const sh=parseFloat(document.getElementById(`p_${a.ticker}`)?.value);
    const co=parseFloat(document.getElementById(`c_${a.ticker}`)?.value);
    if(!isNaN(sh)) S.portfolio[a.ticker]=sh;
    if(!isNaN(co)) S.costBasis[a.ticker]=co;
  }
  return {monthly:S.monthly, portfolio:{...S.portfolio}, costBasis:{...S.costBasis}, savedAt:new Date().toISOString()};
}

async function uploadCloud(){
  const key=document.getElementById('apiKeyInput').value.trim()||S.apiKey;
  const binId=document.getElementById('binIdInput').value.trim()||S.binId;
  if(!key){ toast('請先輸入 API Key','err'); return; }
  toast('上傳中...','info',5000);
  const payload=buildPayload();
  try{
    let r,d;
    if(binId){
      r=await fetch(`https://api.jsonbin.io/v3/b/${binId}`,{
        method:'PUT',
        headers:{'Content-Type':'application/json','X-Master-Key':key},
        body:JSON.stringify(payload),signal:AbortSignal.timeout(10000)
      });
    } else {
      r=await fetch('https://api.jsonbin.io/v3/b',{
        method:'POST',
        headers:{'Content-Type':'application/json','X-Master-Key':key,'X-Bin-Name':'月供追蹤','X-Bin-Private':'true'},
        body:JSON.stringify(payload),signal:AbortSignal.timeout(10000)
      });
    }
    d=await r.json();
    const newId=d?.metadata?.id||binId;
    if(newId){
      S.binId=newId; S.apiKey=key;
      document.getElementById('binIdInput').value=newId;
      document.getElementById('cloudStatus').textContent=`已同步 ✓`;
      toast('數據已上傳 ☁️ ✓ Bin ID 已填入');
    } else { toast('上傳失敗：'+(d?.message||JSON.stringify(d).slice(0,60)),'err'); }
  } catch(e){ toast('上傳失敗：'+e.message,'err'); }
}

async function downloadCloud(){
  const key=document.getElementById('apiKeyInput').value.trim()||S.apiKey;
  const binId=document.getElementById('binIdInput').value.trim()||S.binId;
  if(!key||!binId){ toast('請輸入 API Key 同 Bin ID','err'); return; }
  toast('下載中...','info',5000);
  try{
    const r=await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`,{
      headers:{'X-Master-Key':key},signal:AbortSignal.timeout(10000)
    });
    const d=await r.json();
    if(d?.record){
      const rec=d.record;
      if(rec.monthly) S.monthly=rec.monthly;
      if(rec.portfolio) Object.assign(S.portfolio,rec.portfolio);
      if(rec.costBasis) Object.assign(S.costBasis,rec.costBasis);
      S.apiKey=key; S.binId=binId;
      document.getElementById('monthlyInput').value=S.monthly;
      for(const a of ALLOCS){
        const pi=document.getElementById(`p_${a.ticker}`);
        const ci=document.getElementById(`c_${a.ticker}`);
        if(pi) pi.value=S.portfolio[a.ticker]||'';
        if(ci) ci.value=S.costBasis[a.ticker]||'';
      }
      document.getElementById('cloudStatus').textContent=`已還原 ✓ ${rec.savedAt?new Date(rec.savedAt).toLocaleDateString('zh-HK'):''}`;
      toast('數據已從雲端還原 ⬇️ ✓');
    } else { toast('下載失敗：'+(d?.message||'Bin 不存在'),'err'); }
  } catch(e){ toast('下載失敗：'+e.message,'err'); }
}

// ── INIT ──
if(new Date().getDate()===7) document.getElementById('reminder').style.display='flex';
document.getElementById('monthlyLabel').textContent=`HKD ${S.monthly.toLocaleString()}`;
document.getElementById('fxRate').textContent=`1 USD = HKD ${S.fxRate.toFixed(4)}`;
document.getElementById('stxt').textContent='使用預設數據，按刷新獲取最新';
document.getElementById('sdot').style.background='var(--go)';
refreshAll();
</script>
</body>
</html>
